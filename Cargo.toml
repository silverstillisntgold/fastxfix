[package]
name = "fastxfix"
version = "1.0.2"
edition = "2024"
rust-version = "1.89"
description = "Extremely fast prefix/suffix finder for any 2D data type"
documentation = "https://docs.rs/fastxfix"
repository = "https://github.com/silverstillisntgold/fastxfix"
license = "MIT"
keywords = ["parallelism", "prefix", "simd", "suffix"]
categories = ["algorithms"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
rayon = "1.12"

[dev-dependencies]
ya-rand = { version = "3", default-features = false }
